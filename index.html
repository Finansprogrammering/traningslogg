<!doctype html><html lang='sv'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.json'><title>Träningslogg</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;padding:0 0 90px}.wrap{max-width:640px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#111827;color:white;font-weight:650}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;background:white}.set{display:grid;grid-template-columns:54px 1fr 1fr;gap:8px;margin:8px 0;align-items:center}.muted{color:#6b7280;font-size:14px}.big{font-size:24px;font-weight:750}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:2}.nav button{background:white;color:#6b7280;border-radius:0;max-width:210px;flex:1}.nav button.active{color:#111827;font-weight:800}h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:6px 0}.hidden{display:none}.pill{display:inline-block;background:#eef2ff;border-radius:99px;padding:5px 9px;font-size:13px;margin:2px}.exerciseHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.positive{color:#047857;font-weight:700}
</style></head><body><main class='wrap'><div class='top'><h1>Träningslogg</h1><span id='status' class='muted'>Lokalt</span></div><section id='train'></section><section id='history' class='hidden'></section><section id='settings' class='hidden'></section></main><nav class='nav'><button data-view='train' class='active'>Träna</button><button data-view='history'>Historik</button><button data-view='settings'>Inställningar</button></nav><script src='app.js'></script></body></html>
